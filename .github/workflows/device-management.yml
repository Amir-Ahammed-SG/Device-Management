name: Device Management

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (Windows PowerShell 5.1)
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose unique release ID
        id: release
        run: |
          $releaseId = (Get-Date).ToUniversalTime().ToString('yyyyMMdd') + '-actions-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
      - name: Build, validate and run isolated fixtures
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          & .\DeviceManagement\Deployment\Test-GitHubRelease.ps1 -ReleaseId $env:RELEASE_ID
      - name: Retain verified release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-management-${{ steps.release.outputs.release_id }}
          path: DeviceManagement/output/releases/${{ steps.release.outputs.release_id }}/
          if-no-files-found: error
          retention-days: 30

  deployment-checks:
    name: Verify deployment and rollback fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 DeviceManagement/Tests/Test-GitHubDeployment.py
        shell: bash

  deploy:
    name: Publish canonical CDN entry
    needs: [build, deployment-checks]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CDN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: device-management-production-cdn
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: device-management-${{ needs.build.outputs.release_id }}
          path: release
      - name: Stage, activate and verify public checksum
        shell: bash
        env:
          CDN_SSH_HOST: ${{ vars.CDN_SSH_HOST }}
          CDN_SSH_USER: ${{ vars.CDN_SSH_USER }}
          CDN_SSH_PORT: ${{ vars.CDN_SSH_PORT }}
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
          CDN_SSH_KNOWN_HOSTS: ${{ secrets.CDN_SSH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: bash DeviceManagement/Deployment/Deploy-Cdn.sh release "$RELEASE_ID"
      - name: Retain deployment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdn-receipt-${{ needs.build.outputs.release_id }}
          path: release/deployment-receipt.json
          if-no-files-found: ignore
          retention-days: 30
